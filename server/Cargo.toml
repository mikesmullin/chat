[package]
name = "chat-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "chat server — static + HMR (rustex1 devserver) with angela embedded; one process, no proxy"

[[bin]]
name = "chat-server"
path = "src/main.rs"

[dependencies]
rustex1-devserver = { path = "../vendor/rustex1/devserver" }
angela = { path = "../../../angela-rs" }
agl = { path = "../../../agl-rs" }
serde_json = "1"
sha2 = "0.10"
regex = "1"
rusqlite = "0.42"
cron = "0.12"
chrono = "0.4"
