<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design Guide</title>
  <!-- the app's real skin, then the storybook layer (wins) -->
  <link rel="stylesheet" href="/kit.css">
  <link rel="stylesheet" href="/styles.css">
  <style>
    /* ================================================================
     Storybook layer — sits on top of the chat app's skin (kit.css +
     styles.css) and retints it for this guide: neutral black/charcoal
     surfaces (no blue in the background family), white ink, indigo +
     pastel accents.

     Routing: m-js Router in HASH mode (permalinks
     storybook.html#/agents, full back/forward, no server support
     needed). The rail is static HTML; Router.set() drives the #app
     content.

     Composition rule (2026-11-12): components are built from other
     components. An item group contains state labels, relative
     timestamps, counters, pie rings, and the nav rail is itself a
     component. Each unit below has its own class; composed components
     reuse the same classes, so the sub-component and its parent render
     identically.

     Group order: Done, Working, Idle — things needing attention first.
     Counters sit inline, immediately right of the group name (not
     floated to the edge); heads are text only (no dot).
     ================================================================ */

    /* retint the base skin to neutral charcoal (wins because it loads last) */
    :root {
      --bg: #0a0b0e;
      --panel: #121317;
      --panel-2: #181a20;
      --line: #1d1f26;
      --line-2: #262931;
      --border: #23252c;
      --text: #f1f3f6;
      --muted: #8e94a2;

      /* indigo — the only cool accent */
      --accent: #7c7ef8;
      --accent-soft: #a9accf;
      --accent-tint: color-mix(in srgb, var(--accent) 10%, transparent);
      --accent-glow: color-mix(in srgb, var(--accent) 6%, transparent);

      /* pastel family — soft, low-chroma, for non-semantic roles */
      --pastel-indigo: #b9bcd9;
      --pastel-violet: #c9bde0;
      --pastel-pink: #f0b8ce;
      --pastel-amber: #f5d8a6;
      --pastel-green: #a8e4b4;
      --pastel-cyan: #aecbe3;
      --pastel-red: #f2adab;

      /* dim gray, near #666 — idle state + its symbol */
      --gray-dim: #6e717a;
    }

    /* base: the two-column shell */
    #sb {
      display: grid;
      grid-template-columns: 264px 1fr;
      height: 100%;
      min-height: 100vh;
    }

    /* ---- rail (left) ---- */
    .sb-rail {
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
    }
    .rail-head { padding: 24px 20px 14px; }
    .rail-head h1 { font-size: 15px; font-weight: 700; letter-spacing: -.015em; line-height: 1.2; color: var(--text); }
    .rail-head p { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .rail-group { margin-top: 18px; padding: 4px 20px 10px; }
    .kicker {
      font-family: var(--mono); font-size: 10.5px; letter-spacing: .16em;
      text-transform: uppercase; color: var(--muted);
    }
    .nav-list {
      list-style: none; padding: 6px 12px 40px;
      display: flex; flex-direction: column; gap: 6px;
      min-height: 0; overflow-y: auto;
    }
    .nav-item {
      display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
      padding: 9px 12px; border: 1px solid transparent; border-radius: 7px;
      background: transparent; font: inherit; font-size: 15px; color: var(--muted);
      cursor: pointer; transition: color .13s, background .13s, border-color .13s;
    }
    .nav-item .ph { color: inherit; font-size: 15px; line-height: 1; flex: 0 0 auto; transition: color .13s; }
    .nav-item span { overflow: hidden; white-space: nowrap; }
    .nav-item:hover { color: var(--text); background: var(--accent-glow); }
    .nav-item.on { color: var(--accent-soft); border-color: var(--accent); background: var(--accent-tint); }
    .nav-item.on .ph { color: var(--accent-soft); }

    /* ---- content (right) ---- */
    .sb-content { min-width: 0; min-height: 100%; overflow-y: auto; background: var(--bg); display: flex; padding: 24px; }
    .feature { margin: auto; display: flex; align-items: center; justify-content: center; width: 100%; }

    /* ================================================================
     Sub-component: pie ring graph — the generic cooldown ring.
     Fill fraction is the first number in `stroke-dasharray` (pathLength
     is normalized to 1). Color comes from `currentColor`, so it tints
     to whatever state it sits in.
     ================================================================ */
    .pie-ring {
      width: 14px; height: 14px;
      display: inline-block;
      flex: 0 0 auto;
      vertical-align: bottom;
    }

    /* ================================================================
     Sub-component: relative timestamp — how long in the state, short
     format (3m, 20m, 1h). Reused in every grouped list. */
    .relative-timestamp {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
      flex: 0 0 auto;
      white-space: nowrap;
    }
    .relative-timestamp .demo-set { display: flex; gap: 6px; align-items: baseline; }
    .relative-timestamp .demo-set span { white-space: nowrap; }

    /* the "agents" menu title: normal weight, dim gray (near #666) */
    .agents-header {
      font-size: 13px;
      font-weight: 400;
      color: var(--gray-dim);
      margin-bottom: 14px;
    }

    /* ================================================================
     Sub-component: counter — the item count for a group (or list).
     Mono, muted, same size + line-height as the group name (sits on the
     same line, vertically centered). Inline; placed by its host, no
     self-alignment. */
    .counter {
      font-family: var(--mono);
      font-size: 12px;
      line-height: inherit;
      color: var(--muted);
      font-weight: 400;
      flex: 0 0 auto;
      white-space: nowrap;
    }
    /* counter demo: single-space (6px at 12px mono) between instances */
    .counter-demo { display: flex; gap: 6px; align-items: baseline; }

    /* ================================================================
     Sub-component: item group — the reusable grouping.
     State = color code (name), then inline counter, then a list of rows.
     No dot before the name — the name itself is the color code.
     Rows are agent rows (robot, name, summary, meta) — see below.
     ================================================================ */
    .item-group { color: var(--muted); margin-bottom: 18px; max-width: 480px; width: 100%; }
    .item-group.idle { color: var(--gray-dim); }
    .item-group.working { color: var(--pastel-amber); }
    .item-group.done { color: var(--accent); }
    .item-group:last-child { margin-bottom: 0; }

    .item-head {
      display: flex; align-items: center; gap: 6px; margin-bottom: 6px;
      font-size: 12px;
    }
    .item-head-name { font-weight: 600; }
    .item-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex; flex-direction: column; gap: 2px;
    }

    .item-row {
      display: flex; align-items: center; gap: 10px;
      padding: 6px 0; border-radius: 8px; color: var(--text);
      transition: background .13s;
    }
    .item-row:hover { background: var(--accent-glow); }
    .item-icon { font-size: 16px; line-height: 1; color: var(--muted); flex: 0 0 auto; transition: color .13s; }
    .item-row:hover .item-icon { color: var(--accent-soft); }
    .item-name { font-weight: 600; flex: 0 0 auto; }
    .item-summary {
      flex: 1 1 auto; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      color: var(--muted); font-size: 13px; padding-right: 4px;
    }
    .item-meta { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }

    /* state symbols (used by item rows; colors are fixed by state,
       not inherited, because the row overrides color to ink) */
    .state-idle {
      width: 10px; height: 10px; border-radius: 50%;
      border: 2px solid var(--gray-dim); background: transparent;
      flex: 0 0 auto;
    }
    .state-done {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent); border: 0;
      flex: 0 0 auto;
    }
    .state-working { color: var(--pastel-amber); flex: 0 0 auto; }

    /* ================================================================
     Component: settings button
     gear (left) · "Settings" (right) — the settings entry point.
     ================================================================ */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      font: inherit; font-size: 15px; font-weight: 500; color: var(--text);
      background: transparent; border: none; border-radius: 0; padding: 0;
      cursor: pointer; transition: color .13s, transform .13s;
    }
    .btn:hover { color: var(--accent-soft); }
    .btn:active { transform: scale(0.98); }
    .btn .ph { font-size: 16px; line-height: 1; color: var(--muted); transition: color .13s; }
    .btn:hover .ph { color: var(--accent-soft); }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ================================================================
     Component: left sidebar navigation — the rail, shown standalone.
     Reuses .sb-rail / .rail-head / .kicker / .nav-list / .nav-item
     classes; in the live page it lives inside #sb.
     ================================================================ */
    .nav-demo {
      width: 264px; height: 460px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .nav-demo .nav-list { padding-bottom: 8px; }
    .nav-demo .nav-item:hover { background: var(--accent-glow); }

    /* demo chrome for sub-component showcases (only; the components
       themselves stay bare) */
    .demo-cap {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; color: var(--muted); margin-bottom: 10px;
    }
    .demo-ring { width: 64px; height: 64px; color: var(--accent); }
    .demo-ring svg, .demo-ring .pie-ring svg { width: 100%; height: 100%; display: block; }

    /* responsive */
    @media (max-width: 860px) {
      #sb { grid-template-columns: 1fr; }
      .sb-rail {
        grid-row: 1 / 1; flex-direction: row; align-items: center;
        border-right: 0; border-bottom: 1px solid var(--border);
        overflow: hidden; height: auto;
      }
      .rail-head { margin: 0; padding: 12px 16px; display: flex; align-items: center; gap: 16px; }
      .rail-group { display: none; }
      .nav-list { flex-direction: row; flex-wrap: wrap; gap: 8px; padding: 10px; overflow: hidden; white-space: nowrap; }
      .sb-content { padding: 16px; }
      .nav-demo { width: 100%; height: 340px; }
    }
  </style>
</head>
<body>
  <div id="sb">
    <!-- left rail: static component navigator (Router drives #app) -->
    <aside class="sb-rail">
      <header class="rail-head">
        <h1>Design Guide</h1>
      </header>
      <div class="rail-group">
        <span class="kicker">Components</span>
      </div>
      <ul class="nav-list" id="rail-nav">
        <li class="nav-item on" data-route="/">Settings Menu Item</li>
        <li class="nav-item" data-route="/agents">Agents Menu</li>
        <li class="nav-item" data-route="/nav-rail">Left Sidebar Navigation</li>
        <li class="nav-item" data-route="/item-group">Item Group</li>
        <li class="nav-item" data-route="/counter">Counter</li>
        <li class="nav-item" data-route="/relative-timestamp">Relative Timestamp</li>
        <li class="nav-item" data-route="/pie-ring-graph">Pie Ring Graph</li>
      </ul>
    </aside>

    <!-- right: content / central focus for the routed component -->
    <main class="sb-content">
      <section class="feature" id="app"></section>
    </main>
  </div>

  <script type="module">
    /*
     Storybook router — m-js Router in HASH mode.

     Permalinks: storybook.html#/agents, ...#/pie-ring-graph.
     Navigation: rail items call Router.set(uri) (pushes history,
     redraws #app content). Back/forward is history-driven by m-js.

     Gotcha (2026-11-12): Router.onChange stores ONE handler and M.mount()
     must own it for the DOM to re-render. Calling Router.onChange after
     mount clobbers the redraw hook and navigation stops touching the DOM.
     The rail active state therefore tracks the route via a native
     hashchange listener instead.

     Composition: agents menu is built from item-group + relative-
     timestamp + counter + pie-ring-graph (same classes, same builders).
     The rail item "Left Sidebar Navigation" is a second instance of
     the rail component.
     */
    import M, { Router } from 'https://mikesmullin.github.io/m-js/dist/m.min.js'

    Router.setMode('hash')

    /* --- reusable sub-components (shared classes, used by composites) --- */
    const relativeTimestamp = (value) =>
      `<span class="relative-timestamp">${value}</span>`;

    const counter = (n) =>
      `<span class="counter">${n}</span>`;

    const pieRing = (fraction, color) => {
      const f = Number(fraction).toFixed(2);
      return `<svg viewBox="0 0 16 16" class="pie-ring" aria-hidden="true" ${color ? `style="color:${color}"` : ''}>
        <circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-opacity=".22" stroke-width="2" pathLength="1"></circle>
        <circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="2" pathLength="1" stroke-dasharray="${f} 1" stroke-linecap="round"></circle>
      </svg>`;
    };

    const stateIcon = (state) => {
      if (state === 'idle') return '<span class="state-idle"></span>';
      if (state === 'done') return '<span class="state-done"></span>';
      return pieRing(0.68, 'var(--pastel-amber)');
    };

    /* --- item group: state name + inline counter + list of rows --- */
    const itemGroup = (state, label, count, rows) => `<div class="item-group ${state}">
      <div class="item-head">
        <span class="item-head-name">${label}</span>
        ${counter(count)}
      </div>
      <ul class="item-list">
        ${rows.join('\n')}
      </ul>
    </div>`;

    /* --- agent row: robot + name + summary + meta(time, state) --- */
    const agentRow = (name, summary, time, state) => `<li class="item-row">
      <span class="item-icon"><i class="ph ph-robot"></i></span>
      <span class="item-name">${name}</span>
      <span class="item-summary">${summary}</span>
      <span class="item-meta">
        ${relativeTimestamp(time)}${stateIcon(state)}
      </span>
    </li>`;

    /* --- left sidebar navigation: the rail itself --- */
    const railNav = () => `<div class="nav-demo">
      <div class="rail-head"><h1>Design Guide</h1></div>
      <div class="rail-group"><span class="kicker">Components</span></div>
      <ul class="nav-list">
        <li class="nav-item on"><span>Settings Menu Item</span></li>
        <li class="nav-item"><span>Agents Menu</span></li>
        <li class="nav-item"><span>Item Group</span></li>
      </ul>
    </div>`;

    /* --- composite components: DONE / WORKING / IDLE (attention first) --- */
    const agentsMenu = () => `<div class="agents-menu">
      <p class="agents-header">Agents</p>
      ${itemGroup('done', 'Done', 2, [
        agentRow('Eve', 'Finished the onboarding copy and tone guide', '1h', 'done'),
        agentRow('Dan', 'Fixed the session timeout bug', '45m', 'done'),
      ])}
      ${itemGroup('working', 'Working', 1, [
        agentRow('Carol', 'Migrating the auth service to the new schema', '12m', 'working'),
      ])}
      ${itemGroup('idle', 'Idle', 3, [
        agentRow('Alice', 'Refactored the retry logic in the fetch client', '20m', 'idle'),
        agentRow('Bob', 'Waiting on CI for the cache patch', '3m', 'idle'),
        agentRow('Fay', 'Tidying the session store after the migration', '45m', 'idle'),
      ])}
    </div>`;

    /* --- route registry --- */
    const routes = {
      '/': () => `<button type="button" class="btn btn-settings">
        <i class="ph ph-gear" aria-hidden="true"></i>
        <span>Settings</span>
      </button>`,
      '/agents': agentsMenu,
      '/nav-rail': railNav,
      '/item-group': () => itemGroup('done', 'Done', 2, [
        agentRow('Eve', 'Finished the onboarding copy and tone guide', '1h', 'done'),
        agentRow('Dan', 'Fixed the session timeout bug', '45m', 'done'),
      ]),
      '/counter': () => `<div class="counter-demo">${counter(1)}${counter(3)}${counter(24)}${counter(128)}</div>`,
      '/relative-timestamp': () => `<div class="relative-timestamp demo-set">
        <span>3m</span><span>20m</span><span>45m</span><span>1h</span>
      </div>`,
      '/pie-ring-graph': () => `<div class="demo-ring">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-opacity=".22" stroke-width="2" pathLength="1"></circle>
          <circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="2" pathLength="1" stroke-dasharray="0.68 1" stroke-linecap="round"></circle>
        </svg>
      </div>`,
    };

    /* title per route */
    const TITLES = {
      '/': 'Settings Menu Item',
      '/agents': 'Agents Menu',
      '/nav-rail': 'Left Sidebar Navigation',
      '/item-group': 'Item Group',
      '/counter': 'Counter',
      '/relative-timestamp': 'Relative Timestamp',
      '/pie-ring-graph': 'Pie Ring Graph',
    };

    for (const [uri, fn] of Object.entries(routes)) {
      Router.register(uri, TITLES[uri], () => fn());
    }

    Router.setTitleFormat((t) => t || 'Design Guide');
    M.mount('#app');
    window.__M = M;
    window.__Router = Router;

    /* rail wiring: click → Router.set (pushes history + redraws).
       The active rail item tracks the route via a native hashchange
       listener — Router.onChange stores only ONE handler, and M.mount
       must own it for the DOM to re-render on navigation. */
    const nav = document.getElementById('rail-nav');
    function syncRail() {
      const cur = Router.uri;
      nav.querySelectorAll('[data-route]').forEach(
        (li) => li.classList.toggle('on', li.dataset.route === cur)
      );
    }
    window.addEventListener('hashchange', syncRail);
    syncRail();
    nav.addEventListener('click', (e) => {
      const li = e.target.closest('[data-route]');
      if (li) Router.set(li.dataset.route);
    });
  </script>
</body>
</html>
